# YouTube 頻道權重表（熱度指標 v2 — P2）
#
# 規則：
#   1. 訂閱數 < min_subscribers 的頻道一律排除（雜訊過濾，同「砍 Dcard」邏輯）
#   2. 通過門檻者，依可信度給權重；未列出者用 default
#   3. 權重 0 = 明確排除（即使訂閱數夠）
#
# 權重尺度（0~1）：
#   1.0  嚴肅專業（半導體/產業深度分析）
#   0.8  嚴肅投資分析
#   0.6  主流財經電視/媒體
#   0.2  明牌台/散戶娛樂
#   0.0  排除

min_subscribers: 20000
default: 0.5

channels:
  # ── 明確排除（使用者指定）──────────────────────────
  來聽美股吧: 0.0              # 美股為主，與台股題材無關
  海豚交易室 范振鴻: 0.0       # 觀看數偏低

  # ── 明牌台 / 散戶娛樂（低權重）─────────────────────
  寶傑點兵／寶傑怎麼說: 0.2

  # ── 嚴肅分析（高權重）──────────────────────────────
  曲博科技教室 Dr. J Class: 1.0
  先探i投資: 0.8
  雷老闆 Remus: 0.8           # 使用者指定加入

  # ── 主流財經電視（中權重）─────────────────────────
  57東森財經新聞: 0.6
  USTV 非凡電視: 0.6
  非凡 股市現場: 0.6
